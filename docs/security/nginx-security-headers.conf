# Q-Flash-Web — recommended nginx security headers
#
# Reference snippet for /etc/nginx/sites-available/unlock.choimaytau.com.
# Maintain in repo as source-of-truth; sync to server during deploy.
#
# After editing the live config:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify from a client:
#   curl -sI https://unlock.choimaytau.com | grep -iE "content-security|permissions|x-frame|strict-transport|referrer|x-content-type"

# ── Strict transport security ────────────────────────────────────────────────
# Forces HTTPS for 2 years on this host + subdomains. Only enable after the
# whole site is reachable over HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ── Content Security Policy ──────────────────────────────────────────────────
# Server header version of the CSP. It intentionally includes frame-ancestors;
# the meta tag in index.html omits that directive because browsers ignore
# frame-ancestors when delivered by meta CSP.
# - script-src allows self-hosted bundles plus Cloudflare's dedicated analytics
#   script origin; automatic injection uses a version-suffixed beacon path.
# - connect-src allows WebUSB asset fetches from xiaomi.choimaytau.com.
# - style-src allows inline styles for Tailwind v4 runtime; tighten if/when
#   Tailwind ships full hash-based mode.
# - frame-ancestors 'none' blocks clickjacking.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://xiaomi.choimaytau.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# ── Permissions-Policy ───────────────────────────────────────────────────────
# Allow WebUSB only on the same origin; deny every other powerful API.
add_header Permissions-Policy "usb=(self), camera=(), microphone=(), geolocation=(), payment=(), bluetooth=(), serial=(), hid=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# ── Cross-origin isolation ───────────────────────────────────────────────────
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# COEP intentionally left off — would break the WebUSB asset origin which is
# served from a separate host without CORP headers. Re-evaluate when the
# asset CDN gains them.

# ── Misc hardening ───────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# ── Cache hygiene for index.html ─────────────────────────────────────────────
# Hashed assets in /assets are immutable; index.html itself must not be cached
# stale or SRI updates will fail to propagate.
location = /index.html {
  add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
